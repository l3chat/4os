name: Build and publish project sites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate saved research and generated catalogue
        run: python3 literary-competitions/scripts/render_catalogue.py --check
      - name: Test catalogue data handling
        run: python3 -m unittest discover -s literary-competitions/scripts -p 'test_catalogue.py'
      - name: Add project directory and global error page
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
      - name: Build literary competitions with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./literary-competitions/docs
          destination: ./_site/literary-competitions
      - name: Check internal links and anchors
        run: python3 literary-competitions/scripts/check_links.py _site --base-path /4os
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
